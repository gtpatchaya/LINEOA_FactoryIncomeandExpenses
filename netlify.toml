[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[functions."keepwarm"]
  schedule = "*/4 * * * *"

[[redirects]]
  from = "/"
  to = "/liff/"
  status = 302

# เส้นทางที่ Express จัดการ → ส่งเข้า function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/api/*"
  to = "/.netlify/functions/api/admin/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/api/webhook"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api/healthz"
  status = 200
  force = true
